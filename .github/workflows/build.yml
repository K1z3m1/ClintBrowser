name: Build Clint Browser

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type (debug = signed with debug key, installable without secrets)'
        type: choice
        options:
          - release
          - debug
        default: release

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  BUILD_TYPE: ${{ inputs.build_type || 'release' }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Cache Gradle Wrapper JAR
        id: cache-wrapper-jar
        uses: actions/cache@v5
        with:
          path: gradle/wrapper/gradle-wrapper.jar
          key: gradle-wrapper-jar-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}

      - name: Provision Gradle Wrapper JAR
        if: steps.cache-wrapper-jar.outputs.cache-hit != 'true'
        run: |
          GRADLE_VERSION=$(grep -oP '(?<=gradle-)[0-9]+\.[0-9]+(\.[0-9]+)?(?=-bin\.zip)' gradle/wrapper/gradle-wrapper.properties)
          cp gradle/wrapper/gradle-wrapper.properties /tmp/gradle-wrapper.properties.bak
          curl -fL -o /tmp/gradle-bin.zip "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"
          unzip -q /tmp/gradle-bin.zip -d /tmp/gradle-dist
          "/tmp/gradle-dist/gradle-${GRADLE_VERSION}/bin/gradle" wrapper --gradle-version "$GRADLE_VERSION" --distribution-type bin
          cp /tmp/gradle-wrapper.properties.bak gradle/wrapper/gradle-wrapper.properties

      - name: Grant Execute Permission for gradlew
        run: chmod +x gradlew

      - name: Decode Signing Keystore
        if: env.BUILD_TYPE == 'release'
        run: |
          printf '%s' "${{ secrets.BASE_64_SIGNING_KEY }}" | tr -d '\n' | base64 -d > app/release_keystore.jks

      - name: Create local.properties
        if: env.BUILD_TYPE == 'release'
        run: printf '%s\n' "${{ secrets.LOCAL_PROPERTIES }}" > local.properties

      - name: Build GitHub APKs (${{ env.BUILD_TYPE }})
        run: |
          if [ "$BUILD_TYPE" = "debug" ]; then
            ./gradlew assembleGithubDebug
          else
            ./gradlew assembleGithubRelease
          fi

      - name: List generated APKs
        run: find app/build/outputs/apk/github/$BUILD_TYPE -name "*.apk" | sort

      - name: Upload Universal APK
        uses: actions/upload-artifact@v7
        with:
          name: Clint-Universal-${{ env.BUILD_TYPE }}
          path: |
            app/build/outputs/apk/github/${{ env.BUILD_TYPE }}/app-github-universal-*.apk
            app/build/outputs/apk/github/${{ env.BUILD_TYPE }}/app-github-${{ env.BUILD_TYPE }}.apk
          if-no-files-found: error

      - name: Upload arm64-v8a APK
        uses: actions/upload-artifact@v7
        with:
          name: Clint-arm64-v8a-${{ env.BUILD_TYPE }}
          path: app/build/outputs/apk/github/${{ env.BUILD_TYPE }}/app-github-arm64-v8a-*.apk
          if-no-files-found: warn

      - name: Upload armeabi-v7a APK
        uses: actions/upload-artifact@v7
        with:
          name: Clint-armeabi-v7a-${{ env.BUILD_TYPE }}
          path: app/build/outputs/apk/github/${{ env.BUILD_TYPE }}/app-github-armeabi-v7a-*.apk
          if-no-files-found: warn

      - name: Upload x86 APK
        uses: actions/upload-artifact@v7
        with:
          name: Clint-x86-${{ env.BUILD_TYPE }}
          path: app/build/outputs/apk/github/${{ env.BUILD_TYPE }}/app-github-x86-*.apk
          if-no-files-found: warn

      - name: Upload x86_64 APK
        uses: actions/upload-artifact@v7
        with:
          name: Clint-x86_64-${{ env.BUILD_TYPE }}
          path: app/build/outputs/apk/github/${{ env.BUILD_TYPE }}/app-github-x86_64-*.apk
          if-no-files-found: warn
