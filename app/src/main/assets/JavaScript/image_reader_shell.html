<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg:%%BG%%;--fg:%%FG%%;--panel:%%PANEL%%;--accent:%%ACCENT%%;--ph:%%PH%%;}
*{-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--fg);font-family:-apple-system,Roboto,sans-serif;}
#strip{max-width:1000px;margin:0 auto;}
#top{max-width:1000px;margin:0 auto;padding:64px 16px 4px;text-align:center;font-size:14px;}
#top:empty{padding:0;}
.chap-head{padding:20px 16px 12px;font-size:13px;text-align:center;opacity:.75;word-break:break-word;}
.chap img{display:block;width:100%;height:auto;min-height:240px;background:var(--ph);}
#foot{max-width:1000px;margin:0 auto;padding:28px 16px 80px;text-align:center;font-size:14px;}
.msg{opacity:.7;padding:8px;}
.btn{display:inline-block;margin:6px;padding:12px 22px;border:0;border-radius:24px;background:var(--accent);color:#fff;font-size:15px;}
.btn.alt{background:var(--panel);color:var(--fg);}
#bar{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;gap:2px;padding:6px;background:var(--panel);box-shadow:0 2px 8px rgba(0,0,0,.35);transition:transform .2s ease;}
#bar.hide{transform:translateY(-110%);}
#bar button{flex:none;width:44px;height:40px;border:0;border-radius:10px;background:transparent;color:var(--fg);font-size:22px;}
#bar button.off{opacity:.3;}
#bHd{font-size:13px;font-weight:700;}
#bar button.on{color:var(--accent);}
#bTitle{flex:1;min-width:0;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center;opacity:.85;}
#panel{position:fixed;left:0;right:0;bottom:0;top:12%;z-index:30;display:flex;flex-direction:column;background:var(--panel);border-radius:16px 16px 0 0;box-shadow:0 -4px 16px rgba(0,0,0,.4);transition:transform .22s ease;}
#panel.hide{transform:translateY(105%);}
#pHead{display:flex;align-items:center;padding:12px 16px;font-weight:600;}
#pTitle{flex:1;}
#pClose{border:0;background:transparent;color:var(--fg);font-size:20px;width:40px;height:36px;}
#pBody{flex:1;overflow-y:auto;}
.item{padding:14px 18px;border-top:1px solid rgba(128,128,128,.2);font-size:14px;}
.item.cur{color:var(--accent);font-weight:600;}
#pMsg{padding:24px 18px;text-align:center;opacity:.75;font-size:14px;}
#toast{position:fixed;left:50%;bottom:48px;transform:translateX(-50%);max-width:80%;padding:10px 16px;border-radius:20px;background:rgba(30,30,30,.92);color:#fff;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:40;text-align:center;}
#toast.show{opacity:1;}
</style>
</head>
<body>
<div id="bar" class="hide">
<button id="bPrev">&#8249;</button>
<div id="bTitle"></div>
<button id="bList">&#9776;</button>
<button id="bHd">HD</button>
<button id="bAuto">&#8734;</button>
<button id="bNext">&#8250;</button>
</div>
<div id="top"></div>
<div id="strip"></div>
<div id="foot"></div>
<div id="panel" class="hide">
<div id="pHead"><span id="pTitle"></span><button id="pClose">&#10005;</button></div>
<div id="pBody"></div>
</div>
<div id="toast"></div>
<script>window.__clintInit = %%INIT%%;</script>
<script>
(function() {
    var B = window.ClintReader || { go: function() {}, openChapter: function() {}, setHd: function() {}, goMode: function() {}, home: function() {}, openInTab: function() {}, visible: function() {}, setAutoNext: function() {} };
    var L = {};
    function $(id) { return document.getElementById(id); }
    var strip = $('strip'), topEl = $('top'), foot = $('foot'), bar = $('bar'), panel = $('panel'), pBody = $('pBody'), toastEl = $('toast');
    var chapters = [], loading = false, autoNext = true, hd = false, retryAfter = 0, jumpTo = false, lastVis = null, toastT = 0, ticking = false, loadingPrev = false, lastY = 0, goingUp = false, touchY = null;

    function toast(m) {
        if (!m) return;
        toastEl.textContent = m;
        toastEl.classList.add('show');
        clearTimeout(toastT);
        toastT = setTimeout(function() { toastEl.classList.remove('show'); }, 2200);
    }
    function nu(u) { return (u || '').split('#')[0].replace(/\/$/, ''); }
    function lastChapter() { return chapters[chapters.length - 1]; }
    function curChapter() {
        var mid = window.innerHeight * 0.35, cur = chapters[0];
        for (var i = 0; i < chapters.length; i++) {
            if (chapters[i].el.getBoundingClientRect().top <= mid) cur = chapters[i];
        }
        return cur;
    }
    function setImg(im, u, fb) {
        var tries = 0, usedFb = false;
        im.onerror = function() {
            if (fb && !usedFb) { usedFb = true; im.src = fb; return; }
            var cur = usedFb ? fb : u;
            if (cur.indexOf('data:') === 0 || tries >= 2) return;
            tries++;
            setTimeout(function() { im.src = cur + (cur.indexOf('?') < 0 ? '?' : '&') + '_r=' + Date.now() + tries; }, 1500);
        };
        im.src = u;
    }
    function btn(label, fn, alt) {
        var b = document.createElement('button');
        b.className = 'btn' + (alt ? ' alt' : '');
        b.textContent = label;
        b.onclick = fn;
        return b;
    }
    function msg(t) {
        var d = document.createElement('div');
        d.className = 'msg';
        d.textContent = t;
        return d;
    }
    function msgP(t) {
        var d = document.createElement('div');
        d.id = 'pMsg';
        d.textContent = t;
        return d;
    }

    function updateBar() {
        var c = curChapter();
        $('bTitle').textContent = c ? c.title : '';
        var i = c ? chapters.indexOf(c) : 0;
        $('bPrev').classList.toggle('off', !(c && (c.hasPrev || i > 0)));
        $('bNext').classList.toggle('off', !(c && (c.hasNext || i < chapters.length - 1)));
        $('bList').classList.toggle('off', !(c && c.hasHome));
        $('bAuto').classList.toggle('on', autoNext);
        $('bHd').classList.toggle('on', hd);
    }
    function updateFoot() {
        foot.textContent = '';
        var last = lastChapter();
        if (!last) return;
        if (loading && !loadingPrev) { foot.appendChild(msg(L.loading || '')); return; }
        if (last.hasNext) {
            foot.appendChild(btn(L.next || '', function() { requestNext(last, true); }));
        } else {
            foot.appendChild(msg(L.noNext || ''));
        }
        if (last.hasHome) foot.appendChild(btn(L.chapters || '', openList, true));
    }
    function updateTop() {
        topEl.textContent = '';
        var first = chapters[0];
        if (!first) return;
        if (loading && loadingPrev) { topEl.appendChild(msg(L.loading || '')); return; }
        if (first.hasPrev) topEl.appendChild(btn(L.prev || '', function() { requestPrev(first); }, true));
    }
    function refresh() { updateTop(); updateFoot(); updateBar(); }

    function requestNext(c, append) {
        if (loading) return;
        if (append) { loading = true; refresh(); }
        B.go('next', c.id, !!append);
    }

    function requestPrev(c) {
        if (loading || !c || !c.hasPrev) return;
        loading = true;
        loadingPrev = true;
        refresh();
        B.goMode('prev', c.id, 'prepend');
    }
    function pullPrev() {
        var first = chapters[0];
        if (!first || loading) return;
        if (first.hasPrev) requestPrev(first);
        else toast(L.noPrev);
    }

    function check(auto) {
        var c = curChapter();
        if (c && c !== lastVis) {
            lastVis = c;
            B.visible(c.id, c.title);
            updateBar();
        }
        if (!auto) return;
        var last = lastChapter();
        if (autoNext && !loading && last && last.hasNext && Date.now() > retryAfter) {
            var rem = document.documentElement.scrollHeight - window.scrollY - window.innerHeight;
            if (rem < window.innerHeight * 2.5) requestNext(last, true);
        }
        var first = chapters[0];
        if (autoNext && goingUp && !loading && first && first.hasPrev && Date.now() > retryAfter && window.scrollY < window.innerHeight * 1.5) {
            requestPrev(first);
        }
    }
    function onScroll() {
        if (ticking) return;
        ticking = true;
        requestAnimationFrame(function() {
            ticking = false;
            var y = window.scrollY;
            goingUp = y < lastY;
            lastY = y;
            check(true);
        });
    }
    window.addEventListener('scroll', onScroll, { passive: true });
    document.addEventListener('touchstart', function(e) {
        touchY = e.touches && e.touches.length === 1 ? e.touches[0].clientY : null;
    }, { passive: true });
    document.addEventListener('touchmove', function(e) {
        if (touchY === null || !e.touches || !e.touches.length) return;
        if (window.scrollY <= 0 && e.touches[0].clientY - touchY > 70) {
            touchY = null;
            pullPrev();
        }
    }, { passive: true });
    document.addEventListener('touchend', function() { touchY = null; }, { passive: true });
    window.addEventListener('wheel', function(e) {
        if (e.deltaY < 0 && window.scrollY <= 0) pullPrev();
    }, { passive: true });

    function addChapter(d) {
        if (d.mode === 'replace') {
            strip.textContent = '';
            chapters = [];
            lastVis = null;
            lastY = 0;
            goingUp = false;
            window.scrollTo(0, 0);
        }
        var sec = document.createElement('section');
        sec.className = 'chap';
        var h = document.createElement('div');
        h.className = 'chap-head';
        h.textContent = d.title || '';
        sec.appendChild(h);
        var imgs = d.images || [];
        var fbs = d.fallbacks || [];
        var imgEls = [];
        for (var i = 0; i < imgs.length; i++) {
            var im = document.createElement('img');
            im.alt = '';
            im.decoding = 'async';
            im.loading = 'lazy';
            im.referrerPolicy = 'strict-origin-when-cross-origin';
            setImg(im, imgs[i], fbs[i] || '');
            imgEls.push(im);
            sec.appendChild(im);
        }
        var rec = { id: d.id, el: sec, imgEls: imgEls, title: d.title || '', url: d.url || '', hasNext: !!d.hasNext, hasPrev: !!d.hasPrev, hasHome: !!d.hasHome };
        if (d.mode === 'prepend' && chapters.length) {
            var anchor = chapters[0].el;
            var before = anchor.getBoundingClientRect().top;
            strip.style.overflowAnchor = 'none';
            strip.insertBefore(sec, strip.firstChild);
            chapters.unshift(rec);
            loading = false;
            loadingPrev = false;
            refresh();
            var diff = anchor.getBoundingClientRect().top - before;
            if (diff) window.scrollBy(0, diff);
            lastY = window.scrollY;
            goingUp = false;
            requestAnimationFrame(function() { strip.style.overflowAnchor = ''; });
            check(false);
            return;
        }
        strip.appendChild(sec);
        chapters.push(rec);
        loading = false;
        loadingPrev = false;
        if (jumpTo && d.mode === 'append') { jumpTo = false; sec.scrollIntoView(); }
        refresh();
        check(false);
    }

    function onError(d) {
        jumpTo = false;
        if (d.kind === 'busy') {
            loading = false;
            loadingPrev = false;
            retryAfter = Date.now() + 1500;
            refresh();
            return;
        }
        loading = false;
        loadingPrev = false;
        var c = null;
        for (var i = 0; i < chapters.length; i++) if (chapters[i].id === d.id) c = chapters[i];
        if (d.kind === 'noNext' && c) c.hasNext = false;
        if (d.kind === 'noPrev' && c) c.hasPrev = false;
        if (d.kind === 'failed') retryAfter = Date.now() + 8000;
        if (!panel.classList.contains('hide') && (d.kind === 'noHome' || d.kind === 'failed')) {
            pBody.textContent = '';
            pBody.appendChild(msgP(d.message || ''));
        } else if (d.kind !== 'same') {
            toast(d.message);
        }
        refresh();
    }

    function onUpgrade(d) {
        var c = null;
        for (var i = 0; i < chapters.length; i++) if (chapters[i].id === d.id) c = chapters[i];
        if (!c) return;
        var items = d.items || [];
        for (var k = 0; k < items.length; k++) {
            var it = items[k], im = c.imgEls[it.i];
            if (im && it.u) setImg(im, it.u, it.fb || '');
        }
    }

    function openList() {
        var c = curChapter();
        if (!c || !c.hasHome) { toast(L.noChapters); return; }
        panel.classList.remove('hide');
        pBody.textContent = '';
        pBody.appendChild(msgP(L.loading || ''));
        B.home(c.id);
    }
    function closeList() { panel.classList.add('hide'); }

    function onChapterList(d) {
        pBody.textContent = '';
        var list = d.chapters || [];
        if (!list.length) {
            pBody.appendChild(msgP(L.noChapters || ''));
            if (d.homeUrl) {
                var w = document.createElement('div');
                w.style.textAlign = 'center';
                w.appendChild(btn(L.openInBrowser || '', function() { B.openInTab(d.homeUrl); }));
                pBody.appendChild(w);
            }
            return;
        }
        var c = curChapter();
        var curUrl = nu(c ? c.url : '');
        var curEl = null;
        list.forEach(function(ch) {
            var it = document.createElement('div');
            it.className = 'item';
            it.textContent = ch.t;
            if (nu(ch.h) === curUrl) { it.className += ' cur'; curEl = it; }
            it.onclick = function() { closeList(); B.openChapter(ch.h); };
            pBody.appendChild(it);
        });
        if (curEl) curEl.scrollIntoView({ block: 'center' });
    }

    function goNext() {
        var c = curChapter();
        if (!c) return;
        var i = chapters.indexOf(c);
        if (i < chapters.length - 1) { chapters[i + 1].el.scrollIntoView(); return; }
        if (!c.hasNext) { toast(L.noNext); return; }
        jumpTo = true;
        requestNext(c, true);
    }
    function goPrev() {
        var c = curChapter();
        if (!c) return;
        var i = chapters.indexOf(c);
        if (c.el.getBoundingClientRect().top < -300) { c.el.scrollIntoView(); return; }
        if (i > 0) { chapters[i - 1].el.scrollIntoView(); return; }
        if (!c.hasPrev) { toast(L.noPrev); return; }
        B.go('prev', c.id, false);
    }

    $('bPrev').onclick = goPrev;
    $('bNext').onclick = goNext;
    $('bList').onclick = openList;
    $('bAuto').onclick = function() {
        autoNext = !autoNext;
        B.setAutoNext(autoNext);
        toast((L.autoNext || '') + (autoNext ? ' \u2713' : ' \u2717'));
        updateBar();
    };
    $('bHd').onclick = function() {
        hd = !hd;
        B.setHd(hd);
        toast('HD ' + (hd ? '\u2713' : '\u2717'));
        updateBar();
    };
    $('pClose').onclick = closeList;
    document.addEventListener('click', function(e) {
        if (e.target.closest && e.target.closest('#bar,#panel,#foot,.btn')) return;
        bar.classList.toggle('hide');
    });

    window.ClintReaderUI = {
        init: function(d) {
            L = d.labels || {};
            autoNext = d.autoNext !== false;
            hd = d.hd === true;
            $('pTitle').textContent = L.chapters || '';
            $('bPrev').title = L.prev || '';
            $('bNext').title = L.next || '';
            $('bList').title = L.chapters || '';
            $('bAuto').title = L.autoNext || '';
            addChapter(d.chapter);
        },
        onChapter: addChapter,
        onError: onError,
        onUpgrade: onUpgrade,
        onChapterList: onChapterList
    };
    window.ClintReaderUI.init(window.__clintInit);
})();
</script>
</body>
</html>
